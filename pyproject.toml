[project]
name = "stan-mcp-server"
version = "0.1.0"
description = "Standalone CmdStan MCP Server — structured Bayesian modelling tools for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp[apps]>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.9",
    "cmdstanpy>=1.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # Both arviz majors are supported and tested: 1.x needs Python >=3.12
    # and renamed the CmdStan loader (from_cmdstan -> from_cmdstanpy) plus
    # split plot_ppc into a family, so the install differs by interpreter.
    # The code-runner preamble handles both (_load_idata) and CI runs the
    # loader test on 3.11 (arviz 0.x) and 3.12 (arviz 1.x). Not capped: 0.x
    # is end-of-life and declares support only through Python 3.12.
    "arviz>=0.17",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stan-mcp-server = "stan_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stan_mcp_server"]
