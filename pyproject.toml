[project]
name = "stan-mcp-server"
version = "0.1.0"
description = "Standalone CmdStan MCP Server — structured Bayesian modelling tools for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp[apps]>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.9",
    "cmdstanpy>=1.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # arviz 1.x is a backward-incompatible refactor (from_cmdstan and
    # plot_ppc removed) and requires Python >=3.12, so an unpinned
    # install silently differs by interpreter version. The code tool and
    # every documented example target the 0.x API; 0.23.x installs on
    # 3.10-3.13. Revisit as a deliberate migration, not a resolver accident.
    "arviz>=0.17,<1",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stan-mcp-server = "stan_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stan_mcp_server"]
